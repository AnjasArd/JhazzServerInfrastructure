<VirtualHost *:8028>

    ServerName utara.sevima.site

    ServerAdmin admin@sevima.site

    DocumentRoot /var/www/utara

    Header always set X-Owner-By "Anjas Ard"
    Header always set X-Served-By "Apache2"

    <Directory /var/www/utara>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/utara_error.log
    CustomLog ${APACHE_LOG_DIR}/utara_access.log combined

</VirtualHost>
