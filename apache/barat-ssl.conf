<VirtualHost *:8428>

    ServerName barat.sevima.site

    DocumentRoot /var/www/barat

    SSLEngine On

    SSLCertificateFile \
/etc/ssl/sevima/barat.sevima.site.crt

    SSLCertificateKeyFile \
/etc/ssl/sevima/barat.sevima.site.key

    Header set X-Owner-By "Muhammad Anjas A"

    Header set X-Served-By "apache2"

    <Directory /var/www/barat>

        AllowOverride All

        Require all granted

    </Directory>

</VirtualHost>
